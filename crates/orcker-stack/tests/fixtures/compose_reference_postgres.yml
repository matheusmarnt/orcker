# Generated by orcker.
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        PHP_VERSION: "8.3"
        UID: "1000"
        GID: "1000"
    restart: "no"
    volumes:
      - ./:/var/www
    ports:
      - "127.0.0.1:15173:5173"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - acme
      - development
  nginx:
    image: nginx:1.27-alpine
    restart: "no"
    environment:
      FASTCGI_PASS: "app:9000"
    volumes:
      - ./public:/var/www/public
      - ./storage/app/public:/var/www/storage/app/public:ro
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - app
    networks:
      - acme
      - development
  db:
    image: postgres:16-alpine
    restart: "no"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME} -d $${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - acme-db-data:/var/lib/postgresql/data
    networks:
      - acme
volumes:
  acme-db-data:
networks:
  acme:
    driver: bridge
  development:
    external: true
