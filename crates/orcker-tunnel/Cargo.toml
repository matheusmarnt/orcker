[package]
name                   = "orcker-tunnel"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
description            = "Cloudflare Tunnel argument/config generation and supervised cloudflared lifecycle for Orcker."

[dependencies]
thiserror      = { workspace = true }
async-trait    = { workspace = true }
tokio          = { workspace = true, features = ["process", "net", "rt", "time", "io-util", "macros", "sync"] }

[target.'cfg(unix)'.dependencies]
nix            = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tempfile       = { workspace = true }

[lints]
workspace = true
