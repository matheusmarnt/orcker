[package]
name                   = "orcker-php"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
description            = "PHP-FPM pool supervision and version management for Orcker."

[dependencies]
orcker-core      = { path = "../orcker-core" }
orcker-platform  = { path = "../orcker-platform" }
orcker-supervise = { path = "../orcker-supervise" }
thiserror      = { workspace = true }
async-trait    = { workspace = true }
tracing        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tempfile       = { workspace = true }
tokio          = { workspace = true, features = ["process", "net", "rt", "time", "io-util", "macros", "sync"] }

[target.'cfg(unix)'.dependencies]
nix            = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tempfile       = { workspace = true }
orcker-depcheck  = { path = "../orcker-depcheck" }

[lints]
workspace = true
